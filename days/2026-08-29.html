 dude.", "ko": "잠깐, 그럼 넌 완벽한 채용 대상이네. 그거 진짜 웃기다.", "timestamp": 439}, {"speaker": "화자", "en": "I just need take my time.", "ko": "난 그냥 내 시간을 좀 갖고 싶은 거야.", "timestamp": 446}, {"speaker": "화자", "en": "Ty's like, I just need something to do.", "ko": "타이는 그냥 할 일이 필요하다는 식이야.", "timestamp": 449}, {"speaker": "화자", "en": "T's like, I just want to be busy. I'll pay you.", "ko": "T는 그냥 바쁘고 싶대. 내가 돈 줄게.", "timestamp": 451}, {"speaker": "화자", "en": "You know the price of things like in the real world? Like, how much is a carton of milk?", "ko": "현실 세계 물가를 알긴 해? 우유 한 통이 얼마인지?", "timestamp": 456}, {"speaker": "화자", "en": "10, $12.", "ko": "10, 아니 12달러.", "timestamp": 460}, {"speaker": "화자", "en": "Oh, you're rich as. You're so rich.", "ko": "와, 완전 부자 티 나네. 진짜 부자다.", "timestamp": 462}, {"speaker": "화자", "en": "No, it's not 12 dollars. $4.", "ko": "아니, 12달러 아니야. 4달러야.", "timestamp": 465}, {"speaker": "화자", "en": "I didn't know. And I'm like, you idiot.", "ko": "몰랐어. 그래서 난 '이 바보야' 이런 반응이었지.", "timestamp": 468}], "expressions": [{"expr": "Giving princess", "category": "slang", "formality": "casual", "workplace_safe": false, "tag": "~한 느낌을 준다, ~같은 분위기다 (신조어 'giving')", "quote_en": "Giving princess.", "quote_speaker": "화자", "context": "'giving + 명사/형용사'는 최근 몇 년간 유행한 Gen Z 슬랭으로 '~한 느낌/분위기를 준다', '~같은 바이브다'라는 뜻이다. 원래 패션이나 룩을 평가할 때 많이 쓰였지만 지금은 사람의 성격이나 태도를 묘사할 때도 널리 쓰인다. 여기서는 화려한 방을 보고 상대를 '공주 같다'고 놀리는 맥락에서 사용됐다. 격식 있는 자리에서는 어색하므로 친구 사이 대화에 적합하다.", "listening_tip": "'giving'을 강하게 발음하고 뒤에 오는 명사는 살짝 늘여서 강조하는 억양이 특징이다.", "examples": [{"en": "That outfit is giving old money vibes.", "ko": "그 옷은 딱 대대로 부자 느낌이야."}, {"en": "His attitude today is giving main character energy.", "ko": "오늘 걔 태도는 완전 주인공 느낌이야."}], "timestamp": 410}, {"expr": "lowkey", "category": "slang", "formality": "casual", "workplace_safe": true, "tag": "은근히, 솔직히 말하면 (구어 강조 부사)", "quote_en": "She is lowkey a princess.", "quote_speaker": "화자", "context": "'lowkey'는 원래 '조용히, 은밀하게'라는 뜻이었지만 요즘 구어에서는 '사실은', '은근히', '솔직히'라는 의미의 부사로 자주 쓰인다. 어떤 사실을 살짝 인정하거나 부끄럽지만 진심을 말할 때 자주 등장한다. 반대말은 'highkey'로 '완전히, 확실히'라는 뜻이다. 캐주얼한 대화에서 매우 흔하게 쓰이며 직장에서도 가벼운 잡담이라면 큰 무리 없이 쓸 수 있다.", "listening_tip": "'lowkey'는 한 단어처럼 빠르게 붙여 발음되며 강세는 첫 음절 'low'에 있다.", "examples": [{"en": "I'm lowkey nervous about the interview.", "ko": "나 솔직히 면접 좀 긴장돼."}, {"en": "This song is lowkey my favorite right now.", "ko": "이 노래 요즘 은근히 내 최애야."}], "timestamp": 411}, {"expr": "looking to", "category": "natural_phrase", "formality": "neutral", "workplace_safe": true, "tag": "~할 생각이다, ~하려고 하다", "quote_en": "We're literally looking to fire her.", "quote_speaker": "화자", "context": "'be looking to + 동사'는 '~할 계획이다', '~하려고 알아보는 중이다'라는 뜻으로 일상 대화와 업무 상황 모두에서 매우 자주 쓰이는 표현이다. 여기서는 장난스럽게 팀원을 해고할 '계획'이라고 농담을 던지는 데 쓰였다. 실제 의미보다 뉘앙스가 가볍고 유동적인 계획을 말할 때 적합하다. 'plan to'보다 훨씬 캐주얼하고 자연스럽게 들린다.", "listening_tip": "'looking to'는 빠르게 이어져 '루낑투' 처럼 들리며 to는 거의 슈와(schwa) 발음으로 약화된다.", "examples": [{"en": "We're looking to hire two new developers next month.", "ko": "우리는 다음 달에 신입 개발자 두 명을 뽑으려고 해."}, {"en": "I'm looking to move to a bigger apartment soon.", "ko": "나 곧 더 큰 아파트로 이사하려고 알아보는 중이야."}], "timestamp": 424}, {"expr": "Can I just say", "category": "discourse_marker", "formality": "neutral", "workplace_safe": true, "tag": "그냥 한마디 하자면 (발언 전 완곡한 도입구)", "quote_en": "Can I just say Natalie has the best job in the world?", "quote_speaker": "화자", "context": "'Can I just say'는 본론에 들어가기 전에 자신의 의견이나 감상을 부드럽게 던지는 담화 표지이다. 직접적으로 주장하기보다 완곡하게 말을 꺼낼 때 쓰이며, 감탄이나 칭찬, 불만을 말하기 전에도 자주 등장한다. 회의나 발표 같은 격식 있는 자리에서도 자연스럽게 쓸 수 있는 유용한 표현이다. 뒤에는 보통 화자의 솔직한 감정이나 평가가 이어진다.", "listening_tip": "'Can I just'는 빠르게 이어 발음되어 '캐나이 저스트'처럼 들리는 경우가 많다.", "examples": [{"en": "Can I just say, this was the best presentation of the year.", "ko": "그냥 한마디 하자면, 이건 올해 최고의 발표였어."}, {"en": "Can I just say how proud I am of this team?", "ko": "이 팀이 얼마나 자랑스러운지 그냥 한마디 하고 싶어."}], "timestamp": 421}, {"expr": "that's kind of right", "category": "casual_phrase", "formality": "casual", "workplace_safe": true, "tag": "그거 좀 맞는 말이네 (마지못해 인정할 때)", "quote_en": "there's no Oh, actually, that's kind of right.", "quote_speaker": "화자", "context": "'that's kind of right'는 처음에는 부정하려다가 생각해보니 상대 말이 일리가 있다는 것을 마지못해 인정할 때 쓰는 캐주얼한 표현이다. 'kind of'가 들어가면서 100% 확신하지는 않지만 어느 정도 동의한다는 뉘앙스를 준다. 대화 흐름상 놀라며 인정하는 순간에 자연스럽게 등장한다. 격식 있는 자리에서도 살짝 부드럽게 쓸 수 있는 표현이다.", "listening_tip": "'kind of'는 실제로 '카인더'처럼 축약되어 발음되는 경우가 많다.", "examples": [{"en": "Wait, that's kind of right actually.", "ko": "어, 잠깐만, 그거 사실 좀 맞는 말이네."}, {"en": "I hate to admit it, but that's kind of right.", "ko": "인정하기 싫지만, 그거 좀 맞는 말이야."}], "timestamp": 432}, {"expr": "I'm like", "category": "listening_pattern", "formality": "casual", "workplace_safe": true, "tag": "나는 이렇게 반응했어 (구어체 인용 표지 quotative like)", "quote_en": "And I'm like, you idiot.", "quote_speaker": "화자", "context": "구어체 영어에서 'I'm like' / '~'s like'는 'I said' 대신 자신의 반응이나 생각, 말을 인용할 때 쓰는 매우 흔한 quotative 표현이다. 실제로 말한 대사가 아니어도 그때의 느낌이나 속마음을 재연하듯 표현할 때 자주 쓰인다. 이 영상에서도 여러 번 반복적으로 등장하며(Ty's like, T's like 등) 캐주얼한 스토리텔링에 필수적인 패턴이다. 리스닝에서 이 패턴을 놓치면 누가 실제로 말한 건지 헷갈릴 수 있어 주의가 필요하다.", "listening_tip": "'I'm like'는 강세 없이 빠르게 지나가고 뒤에 오는 인용 내용에 강세와 감정이 실리는 경우가 많다.", "examples": [{"en": "She told me the price and I'm like, no way.", "ko": "걔가 가격을 말해줬는데 난 '말도 안 돼' 이런 반응이었어."}, {"en": "He's like, just trust me, and I'm like, okay fine.", "ko": "걔가 '그냥 날 믿어'라고 하길래 난 '알겠어, 좋아' 이랬어."}], "timestamp": 468}], "video_title": "She got jealous", "channel_name": "David Dobrik", "video_url": "https://www.youtube.com/watch?v=aYmkOO-c0WI", "lesson_date": "2026-08-29", "video_id": "aYmkOO-c0WI"}</script>
<script>
  // 보안 참고: 아래 데이터(data)는 유튜브 자막/LLM 생성 결과이며 신뢰할 수 없는 외부 콘텐츠다.
  // 저장형 XSS를 막기 위해 el()로 만든 요소는 전부 textContent만 쓰고, innerHTML은
  // 이 파일이 직접 작성한 고정 마크업(SVG 아이콘)에만 사용한다.
  const data = JSON.parse(document.getElementById('expr-data').textContent);
  const cardsEl = document.getElementById('cards');
  const jumpEl = document.getElementById('jump-row');
  let player;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  document.getElementById('scene').textContent = data.scene_summary;

  const sourceEl = document.getElementById('source-line');
  if (data.video_title) {
    sourceEl.textContent = `${data.video_title} · ${data.channel_name || ''} · `;
    const link = el('a', '', '원본 영상 보기');
    link.href = data.video_url || `https://www.youtube.com/watch?v=${data.video_id}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    sourceEl.appendChild(link);
    sourceEl.appendChild(el('span', '', ' · 표현 해설/번역은 AI가 생성했습니다.'));
  } else {
    sourceEl.textContent = 'AI가 생성한 번역과 해설입니다.';
  }

  function fmtTs(sec) {
    return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }

  function seek(ts) {
    if (player && player.seekTo) {
      player.seekTo(ts, true);
      player.playVideo();
    }
  }

  const scriptEl = document.getElementById('script');
  const scriptLines = [];
  data.script.forEach((line) => {
    const row = el('div', 'script-line');
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `${fmtTs(line.timestamp)}${' '}지점으로 이동`);
    row.appendChild(el('div', 'speaker', line.speaker));
    row.appendChild(el('div', 'script-en', line.en));
    row.appendChild(el('div', 'script-ko', line.ko));
    row.addEventListener('click', () => seek(line.timestamp));
    row.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        seek(line.timestamp);
      }
    });
    scriptEl.appendChild(row);
    scriptLines.push({ ts: line.timestamp, el: row });
  });

  let loopEnabled = false;

  // ponytail: naive 400ms poll, switch to rAF+state gating if this were a battery-sensitive app
  let activeLine = null;
  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();

    if (loopEnabled && t >= data.end_sec - 0.5) {
      player.seekTo(data.start_sec, true);
    }

    let current = scriptLines[0];
    for (const line of scriptLines) {
      if (line.ts <= t) current = line; else break;
    }
    if (current && current.el !== activeLine) {
      if (activeLine) {
        activeLine.classList.remove('active');
        activeLine.removeAttribute('aria-current');
      }
      current.el.classList.add('active');
      current.el.setAttribute('aria-current', 'true');
      activeLine = current.el;
    }
  }, 400);

  // --- 재생 속도 / 구간 반복 ---
  document.querySelectorAll('.speed-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(btn.dataset.rate));
      document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const loopBtn = document.getElementById('loop-toggle');
  loopBtn.addEventListener('click', () => {
    loopEnabled = !loopEnabled;
    loopBtn.setAttribute('aria-pressed', String(loopEnabled));
    loopBtn.classList.toggle('active', loopEnabled);
  });

  // --- 자막 모드 (영어만 / 영어+한국어 / 숨기기), 마지막 선택을 기억한다 ---
  const SUB_MODE_KEY = 'english-learning-sub-mode';
  function applySubMode(mode) {
    document.body.dataset.subMode = mode;
    localStorage.setItem(SUB_MODE_KEY, mode);
    document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  }
  document.querySelectorAll('.mode-btn').forEach((btn) => {
    btn.addEventListener('click', () => applySubMode(btn.dataset.mode));
  });
  applySubMode(localStorage.getItem(SUB_MODE_KEY) || 'both');

  function chevronIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'chevron');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M6 9l6 6 6-6');
    svg.appendChild(path);
    return svg;
  }

  data.expressions.forEach((e, i) => {
    const chip = el('a', 'jump-chip display', e.expr);
    chip.href = `#expr-${i}`;
    chip.addEventListener('click', (ev) => {
      ev.preventDefault();
      const card = document.getElementById(`expr-${i}`);
      card.open = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      seek(e.timestamp);
      card.querySelector('.expr').focus();
    });
    jumpEl.appendChild(chip);

    const details = document.createElement('details');
    details.className = 'card';
    details.id = `expr-${i}`;
    if (i === 0) details.open = true;

    const summary = el('summary', 'card-top');
    const main = el('div', 'card-top-main');
    main.appendChild(chevronIcon());
    const titleWrap = el('div');
    const metaRow = el('div', 'expr-meta');
    metaRow.appendChild(el('span', 'category-badge', e.category.replace(/_/g, ' ')));
    if (!e.workplace_safe) {
      metaRow.appendChild(el('span', 'workplace-warning', '직장 사용 주의'));
    }
    titleWrap.appendChild(metaRow);
    const exprTitle = el('div', 'expr display', e.expr);
    exprTitle.setAttribute('tabindex', '-1');  // 점프 후 포커스 이동 대상(탭 순서에는 없음)
    titleWrap.appendChild(exprTitle);
    titleWrap.appendChild(el('div', 'tag', e.tag));
    main.appendChild(titleWrap);
    summary.appendChild(main);

    const tsBtn = el('button', 'ts', fmtTs(e.timestamp));
    tsBtn.type = 'button';
    tsBtn.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      seek(e.timestamp);
    });
    summary.appendChild(tsBtn);
    details.appendChild(summary);

    const body = el('div', 'card-body');

    const quoteBox = el('div', 'subbox subbox-quote');
    quoteBox.appendChild(el('div', 'subbox-label', '드라마 속 문장'));
    quoteBox.appendChild(el('div', 'quote', `"${e.quote_en}"`));
    quoteBox.appendChild(el('div', 'quote-speaker', `— ${e.quote_speaker}`));
    body.appendChild(quoteBox);

    const contextBox = el('div', 'subbox subbox-context');
    contextBox.appendChild(el('div', 'subbox-label', '문화 / 유머 포인트'));
    contextBox.appendChild(el('div', 'context', e.context));
    body.appendChild(contextBox);

    const tipBox = el('div', 'subbox subbox-tip');
    tipBox.appendChild(el('div', 'subbox-label', '리스닝 포인트'));
    tipBox.appendChild(el('div', 'tip', e.listening_tip));
    body.appendChild(tipBox);

    const exampleBox = el('div', 'subbox subbox-example');
    exampleBox.appendChild(el('div', 'subbox-label', '예문'));
    e.examples.forEach((ex) => {
      const exWrap = el('div', 'example');
      exWrap.appendChild(el('div', 'en', ex.en));
      exWrap.appendChild(el('div', 'ko', ex.ko));
      exampleBox.appendChild(exWrap);
    });
    body.appendChild(exampleBox);

    details.appendChild(body);
    cardsEl.appendChild(details);
  });

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: data.video_id,
      playerVars: { start: data.start_sec, end: data.end_sec, autoplay: 1, rel: 0 },
      events: {
        onReady: (ev) => ev.target.playVideo()
      }
    });
  };

  // --- 오늘의 복습 퀴즈 (기존 표현 데이터로 클라이언트에서 생성, 별도 LLM 호출 없음) ---
  function shuffled(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function saveQuizProgress(questions, results) {
    const STORE_KEY = 'english-learning-progress';
    const store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const lessonId = data.lesson_date || data.video_id;
    store[lessonId] = {
      completed_at: new Date().toISOString(),
      quiz_results: results,
      // ponytail: 정답/오답 2단계 SRS. "애매함" 같은 중간 단계는 다음 단계에서.
      review_due: questions.map((q) => ({ expr: q.expr, due_in_days: results[q.expr] ? 7 : 1 })),
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  function buildQuiz() {
    const quizEl = document.getElementById('quiz');
    const pool = data.expressions;
    if (pool.length < 3) {
      quizEl.textContent = '이 학습에는 퀴즈를 만들 표현이 부족해요.';
      return;
    }
    const questions = shuffled(pool).slice(0, 3);
    const results = {};

    questions.forEach((correctExpr, qi) => {
      const distractors = shuffled(pool.filter((p) => p.expr !== correctExpr.expr)).slice(0, 2);
      const options = shuffled([correctExpr, ...distractors]);

      const qBox = el('div', 'quiz-q');
      qBox.appendChild(el('div', 'quiz-question', `Q${qi + 1}. "${correctExpr.expr}"의 뜻/뉘앙스로 가장 알맞은 것은?`));
      const optsEl = el('div', 'quiz-options');

      options.forEach((opt) => {
        const btn = el('button', 'quiz-option', opt.tag);
        btn.type = 'button';
        btn.addEventListener('click', () => {
          const isCorrect = opt.expr === correctExpr.expr;
          Array.from(optsEl.children).forEach((b) => { b.disabled = true; });
          btn.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect) {
            const correctBtn = Array.from(optsEl.children).find((b) => b.textContent === correctExpr.tag);
            if (correctBtn) correctBtn.classList.add('correct');
          }
          results[correctExpr.expr] = isCorrect;
          if (Object.keys(results).length === questions.length) {
            const correctCount = Object.values(results).filter(Boolean).length;
            const summary = el(
              'div', 'quiz-result',
              `오늘의 표현 ${data.expressions.length}개 · 퀴즈 ${questions.length}문제 중 ${correctCount}개 정답. ` +
              (correctCount < questions.length ? '틀린 표현은 내일 다시 볼게요.' : '완벽해요! 7일 뒤에 복습해요.')
            );
            quizEl.appendChild(summary);
            saveQuizProgress(questions, results);
          }
        });
        optsEl.appendChild(btn);
      });
      qBox.appendChild(optsEl);
      quizEl.appendChild(qBox);
    });
  }
  buildQuiz();

  // --- 다음 학습 관심사 신청: 서버가 없으니 GitHub 이슈를 임시 저장소로 사용한다 ---
  const topicInput = document.getElementById('topic-input');
  const topicSubmit = document.getElementById('topic-submit');
  function submitTopicRequest() {
    const text = topicInput.value.trim();
    if (!text) return;
    const url = `https://github.com/Owen-Choe/English-Learning/issues/new?title=${encodeURIComponent(text)}&labels=topic-request`;
    window.open(url, '_blank', 'noopener');
    topicInput.value = '';
  }
  topicSubmit.addEventListener('click', submitTopicRequest);
  topicInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') submitTopicRequest();
  });
</script>
</body>
</html>
