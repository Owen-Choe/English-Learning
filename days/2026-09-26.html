  .expr-meta { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .category-badge, .workplace-warning {

 "en": "If I built all that and more, do you think the community would love it?", "ko": "내가 그거 다 짓고 더 지으면, 마을 사람들이 좋아할까?", "timestamp": 230}, {"speaker": "화자", "en": "I'll see you in a couple months.", "ko": "몇 달 뒤에 다시 보자.", "timestamp": 236}, {"speaker": "화자", "en": "Obviously, Nolan, they need water, so we're digging 'em a well.", "ko": "당연히, Nolan, 사람들에게 물이 필요하니까 우리는 우물을 파고 있어.", "timestamp": 251}], "expressions": [{"expr": "act like", "category": "natural_phrase", "formality": "casual", "workplace_safe": true, "tag": "~인 척해, ~처럼 행동해 (구어체)", "quote_en": "Nolan, act like this isn't your first village you built.", "quote_speaker": "화자", "context": "'act like'는 '~인 척하다'라는 뜻으로, 실제로는 그렇지 않지만 그런 것처럼 행동하라고 농담조로 지시할 때 자주 쓰인다. 여기서는 Nolan이 실제로 서투른데도 능숙한 척 연기하라는 유머러스한 놀림으로 사용됐다. 친구 사이에서 장난스럽게 놀릴 때 매우 흔하게 쓰이는 표현이다.", "listening_tip": "'act like'는 빠르게 이어져 '액라익'처럼 들리며, like 뒤의 절이 자연스럽게 붙는다.", "examples": [{"en": "Act like you know what you're doing.", "ko": "네가 뭘 하는지 아는 척해."}, {"en": "She acted like she didn't hear me.", "ko": "그녀는 내 말을 못 들은 척했다."}], "timestamp": 181}, {"expr": "jawn", "category": "cultural_expression", "formality": "casual", "workplace_safe": false, "tag": "그거, 저것 (필라델피아 지역 속어, 아무 명사나 대체 가능)", "quote_en": "That jawn ain't goin' NOwhere.", "quote_speaker": "화자", "context": "'jawn'은 필라델피아 지역에서 유래한 속어로 어떤 명사든 대체할 수 있는 만능 단어다(물건, 사람, 장소, 상황 등 모두 지칭 가능). 다른 화자가 이걸 못 알아듣고 '나무 이름이 John이냐'고 되묻는 장면에서 유머가 발생한다. 필라델피아 출신이 아니면 낯선 표현이라 오해를 살 수 있다는 점에서 문화적 배경 지식이 필요하다.", "listening_tip": "'jawn'은 'John'과 발음이 거의 같아서 원어민이 아니면 고유명사로 착각하기 쉽다. 이 영상에서도 그 오해가 개그 포인트로 쓰였다.", "examples": [{"en": "Pass me that jawn over there.", "ko": "저기 그거 좀 줘봐."}, {"en": "This jawn is crazy good.", "ko": "이거 진짜 대박이다."}], "timestamp": 195}, {"expr": "ain't goin' nowhere", "category": "casual_phrase", "formality": "casual", "workplace_safe": true, "tag": "아무 데도 안 가, 꼼짝 안 해 (구어체 이중부정)", "quote_en": "That jawn ain't goin' NOwhere.", "quote_speaker": "화자", "context": "표준 문법으로는 이중부정이지만 구어체 영어에서는 강조를 위해 흔히 쓰인다. 물건이 단단히 고정되어 움직이지 않는다는 의미로, 못이나 나사가 잘 박혔을 때처럼 안정성을 강조할 때 사용한다. 비격식적이고 리듬감 있는 표현이라 원어민 대화에서 자주 들린다.", "listening_tip": "'ain't'는 'isn't/aren't'의 축약형으로 '에인트'처럼 발음되고, 전체적으로 빠르게 흘러가듯 발음된다.", "examples": [{"en": "Don't worry, this table ain't goin' nowhere.", "ko": "걱정 마, 이 테이블은 꼼짝도 안 해."}, {"en": "He said he ain't goin' nowhere without his dog.", "ko": "그는 자기 개 없이는 아무 데도 안 갈 거라고 말했다."}], "timestamp": 195}, {"expr": "keep goin'", "category": "natural_phrase", "formality": "casual", "workplace_safe": true, "tag": "계속해 (구어체 축약)", "quote_en": "Keep goin'! What else?", "quote_speaker": "화자", "context": "'keep going'의 구어체 축약형으로, 상대방에게 하던 것을 계속하라고 격려하거나 재촉할 때 쓴다. 여기서는 아이들에게 더 필요한 것들을 계속 말해보라고 유도하는 상황에서 사용됐다. 일상 대화에서 매우 자주 등장하는 자연스러운 표현이다.", "listening_tip": "'going'의 g가 탈락되어 '고인'처럼 들리는 것이 특징이며, 이는 매우 흔한 구어체 발음 패턴이다.", "examples": [{"en": "You're doing great, keep goin'!", "ko": "잘하고 있어, 계속해!"}, {"en": "Keep goin', we're almost there.", "ko": "계속 가자, 거의 다 왔어."}], "timestamp": 223}, {"expr": "pretty straightforward", "category": "workplace", "formality": "neutral", "workplace_safe": true, "tag": "꽤 간단해, 명확해 (직장에서도 흔히 쓰는 표현)", "quote_en": "Pretty straightforward! Gotta eat.", "quote_speaker": "화자", "context": "'straightforward'는 '간단하고 명확한'이라는 뜻으로, 복잡하지 않고 이해하기 쉬운 상황이나 설명을 나타낼 때 쓴다. 'pretty'는 '꽤, 상당히'라는 뜻의 강조어로 격식과 비격식 모두에서 자연스럽게 쓰인다. 직장에서 업무 설명이나 지시사항이 명확할 때도 매우 자주 사용되는 실용적 표현이다.", "listening_tip": "'pretty'는 강세가 앞에 오며 '프리티'보다는 '프리이'에 가깝게 빠르게 발음된다.", "examples": [{"en": "The instructions are pretty straightforward.", "ko": "설명서는 꽤 간단해."}, {"en": "It's a pretty straightforward process, nothing to worry about.", "ko": "꽤 간단한 절차니까 걱정할 거 없어."}], "timestamp": 225}, {"expr": "gotta eat", "category": "listening_pattern", "formality": "casual", "workplace_safe": true, "tag": "먹어야지 (have got to의 축약, 연음)", "quote_en": "Pretty straightforward! Gotta eat.", "quote_speaker": "화자", "context": "'gotta'는 'have got to' 또는 'have to'의 구어체 축약형으로 원어민들이 일상 대화에서 거의 항상 이 형태로 발음한다. 짧고 당연한 필요성을 표현할 때 자주 쓰이며 여기서는 '먹는 건 당연히 필요하지'라는 뉘앙스를 전달한다. 리스닝에서 매우 자주 마주치는 축약 패턴이라 반드시 익혀둬야 한다.", "listening_tip": "'gotta'는 '가러' 또는 '가타'처럼 t음이 약화되어 들리며, 뒤에 오는 동사와 자연스럽게 이어진다.", "examples": [{"en": "I gotta go now.", "ko": "나 지금 가야 해."}, {"en": "We gotta finish this by tomorrow.", "ko": "우리 내일까지 이거 끝내야 해."}], "timestamp": 225}, {"expr": "I'll see you in a couple months", "category": "natural_phrase", "formality": "casual", "workplace_safe": true, "tag": "몇 달 뒤에 보자 (자연스러운 작별 인사)", "quote_en": "I'll see you in a couple months.", "quote_speaker": "화자", "context": "'a couple months'는 원래 'a couple of months'가 맞지만 구어체에서는 'of'를 생략하는 경우가 매우 흔하다. 다음 만남까지의 기간을 언급하며 헤어질 때 자연스럽게 쓰는 인사 표현이다. 격식 있는 자리에서는 'of'를 넣는 것이 안전하지만 일상 대화에서는 생략형이 표준처럼 쓰인다.", "listening_tip": "'couple months'는 'of'가 완전히 생략되어 두 단어가 바로 이어져 들린다.", "examples": [{"en": "I'll call you in a couple days.", "ko": "며칠 뒤에 전화할게."}, {"en": "See you in a couple weeks!", "ko": "몇 주 뒤에 보자!"}], "timestamp": 236}, {"expr": "dig 'em a well", "category": "listening_pattern", "formality": "casual", "workplace_safe": true, "tag": "그들에게 우물을 파주다 (them의 축약 연음)", "quote_en": "Obviously, Nolan, they need water, so we're digging 'em a well.", "quote_speaker": "화자", "context": "'em'은 'them'의 구어체 축약형으로 빠른 대화에서 거의 항상 이렇게 발음된다. 격식 있는 글쓰기에서는 절대 쓰지 않지만 원어민의 실제 대화에서는 압도적으로 많이 등장하는 축약 패턴이라 리스닝에 필수적이다. 여기서는 마을 사람들을 위해 우물을 파준다는 뜻을 자연스럽게 전달한다.", "listening_tip": "'em'은 거의 들리지 않을 정도로 약하게 발음되어 'digging'과 거의 붙어서 '디긴엄'처럼 들린다.", "examples": [{"en": "Tell 'em I said hi.", "ko": "그들에게 내가 안부 전한다고 해줘."}, {"en": "I already gave 'em the answer.", "ko": "그들에게 이미 답을 줬어."}], "timestamp": 251}], "video_title": "I Built A City To Save Kids From Illegal Labor", "channel_name": "MrBeast", "video_url": "https://www.youtube.com/watch?v=v9QtM6qnG50", "lesson_date": "2026-09-26", "video_id": "v9QtM6qnG50"}</script>
<script>
  // 보안 참고: 아래 데이터(data)는 유튜브 자막/LLM 생성 결과이며 신뢰할 수 없는 외부 콘텐츠다.
  // 저장형 XSS를 막기 위해 el()로 만든 요소는 전부 textContent만 쓰고, innerHTML은
  // 이 파일이 직접 작성한 고정 마크업(SVG 아이콘)에만 사용한다.
  const data = JSON.parse(document.getElementById('expr-data').textContent);
  const cardsEl = document.getElementById('cards');
  const jumpEl = document.getElementById('jump-row');
  let player;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  document.getElementById('scene').textContent = data.scene_summary;

  const sourceEl = document.getElementById('source-line');
  if (data.video_title) {
    sourceEl.textContent = `${data.video_title} · ${data.channel_name || ''} · `;
    const link = el('a', '', '원본 영상 보기');
    link.href = data.video_url || `https://www.youtube.com/watch?v=${data.video_id}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    sourceEl.appendChild(link);
    sourceEl.appendChild(el('span', '', ' · 표현 해설/번역은 AI가 생성했습니다.'));
  } else {
    sourceEl.textContent = 'AI가 생성한 번역과 해설입니다.';
  }

  function fmtTs(sec) {
    return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }

  function seek(ts) {
    if (player && player.seekTo) {
      player.seekTo(ts, true);
      player.playVideo();
    }
  }

  const scriptEl = document.getElementById('script');
  const scriptLines = [];
  data.script.forEach((line) => {
    const row = el('div', 'script-line');
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `${fmtTs(line.timestamp)}${' '}지점으로 이동`);
    row.appendChild(el('div', 'speaker', line.speaker));
    row.appendChild(el('div', 'script-en', line.en));
    row.appendChild(el('div', 'script-ko', line.ko));
    row.addEventListener('click', () => seek(line.timestamp));
    row.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        seek(line.timestamp);
      }
    });
    scriptEl.appendChild(row);
    scriptLines.push({ ts: line.timestamp, el: row });
  });

  let loopEnabled = false;

  // ponytail: naive 400ms poll, switch to rAF+state gating if this were a battery-sensitive app
  let activeLine = null;
  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();

    if (loopEnabled && t >= data.end_sec - 0.5) {
      player.seekTo(data.start_sec, true);
    }

    let current = scriptLines[0];
    for (const line of scriptLines) {
      if (line.ts <= t) current = line; else break;
    }
    if (current && current.el !== activeLine) {
      if (activeLine) {
        activeLine.classList.remove('active');
        activeLine.removeAttribute('aria-current');
      }
      current.el.classList.add('active');
      current.el.setAttribute('aria-current', 'true');
      activeLine = current.el;
    }
  }, 400);

  // --- 재생 속도 / 구간 반복 ---
  document.querySelectorAll('.speed-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(btn.dataset.rate));
      document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const loopBtn = document.getElementById('loop-toggle');
  loopBtn.addEventListener('click', () => {
    loopEnabled = !loopEnabled;
    loopBtn.setAttribute('aria-pressed', String(loopEnabled));
    loopBtn.classList.toggle('active', loopEnabled);
  });

  // --- 자막 모드 (영어만 / 영어+한국어 / 숨기기), 마지막 선택을 기억한다 ---
  const SUB_MODE_KEY = 'english-learning-sub-mode';
  function applySubMode(mode) {
    document.body.dataset.subMode = mode;
    localStorage.setItem(SUB_MODE_KEY, mode);
    document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  }
  document.querySelectorAll('.mode-btn').forEach((btn) => {
    btn.addEventListener('click', () => applySubMode(btn.dataset.mode));
  });
  applySubMode(localStorage.getItem(SUB_MODE_KEY) || 'both');

  function chevronIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'chevron');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M6 9l6 6 6-6');
    svg.appendChild(path);
    return svg;
  }

  data.expressions.forEach((e, i) => {
    const chip = el('a', 'jump-chip display', e.expr);
    chip.href = `#expr-${i}`;
    chip.addEventListener('click', (ev) => {
      ev.preventDefault();
      const card = document.getElementById(`expr-${i}`);
      card.open = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      seek(e.timestamp);
      card.querySelector('.expr').focus();
    });
    jumpEl.appendChild(chip);

    const details = document.createElement('details');
    details.className = 'card';
    details.id = `expr-${i}`;
    if (i === 0) details.open = true;

    const summary = el('summary', 'card-top');
    const main = el('div', 'card-top-main');
    main.appendChild(chevronIcon());
    const titleWrap = el('div');
    const metaRow = el('div', 'expr-meta');
    metaRow.appendChild(el('span', 'category-badge', e.category.replace(/_/g, ' ')));
    if (!e.workplace_safe) {
      metaRow.appendChild(el('span', 'workplace-warning', '직장 사용 주의'));
    }
    titleWrap.appendChild(metaRow);
    const exprTitle = el('div', 'expr display', e.expr);
    exprTitle.setAttribute('tabindex', '-1');  // 점프 후 포커스 이동 대상(탭 순서에는 없음)
    titleWrap.appendChild(exprTitle);
    titleWrap.appendChild(el('div', 'tag', e.tag));
    main.appendChild(titleWrap);
    summary.appendChild(main);

    const tsBtn = el('button', 'ts', fmtTs(e.timestamp));
    tsBtn.type = 'button';
    tsBtn.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      seek(e.timestamp);
    });
    summary.appendChild(tsBtn);
    details.appendChild(summary);

    const body = el('div', 'card-body');

    const quoteBox = el('div', 'subbox subbox-quote');
    quoteBox.appendChild(el('div', 'subbox-label', '드라마 속 문장'));
    quoteBox.appendChild(el('div', 'quote', `"${e.quote_en}"`));
    quoteBox.appendChild(el('div', 'quote-speaker', `— ${e.quote_speaker}`));
    body.appendChild(quoteBox);

    const contextBox = el('div', 'subbox subbox-context');
    contextBox.appendChild(el('div', 'subbox-label', '문화 / 유머 포인트'));
    contextBox.appendChild(el('div', 'context', e.context));
    body.appendChild(contextBox);

    const tipBox = el('div', 'subbox subbox-tip');
    tipBox.appendChild(el('div', 'subbox-label', '리스닝 포인트'));
    tipBox.appendChild(el('div', 'tip', e.listening_tip));
    body.appendChild(tipBox);

    const exampleBox = el('div', 'subbox subbox-example');
    exampleBox.appendChild(el('div', 'subbox-label', '예문'));
    e.examples.forEach((ex) => {
      const exWrap = el('div', 'example');
      exWrap.appendChild(el('div', 'en', ex.en));
      exWrap.appendChild(el('div', 'ko', ex.ko));
      exampleBox.appendChild(exWrap);
    });
    body.appendChild(exampleBox);

    details.appendChild(body);
    cardsEl.appendChild(details);
  });

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: data.video_id,
      playerVars: { start: data.start_sec, end: data.end_sec, autoplay: 1, rel: 0 },
      events: {
        onReady: (ev) => ev.target.playVideo()
      }
    });
  };

  // --- 오늘의 복습 퀴즈 (기존 표현 데이터로 클라이언트에서 생성, 별도 LLM 호출 없음) ---
  function shuffled(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function saveQuizProgress(questions, results) {
    const STORE_KEY = 'english-learning-progress';
    const store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const lessonId = data.lesson_date || data.video_id;
    store[lessonId] = {
      completed_at: new Date().toISOString(),
      quiz_results: results,
      // ponytail: 정답/오답 2단계 SRS. "애매함" 같은 중간 단계는 다음 단계에서.
      review_due: questions.map((q) => ({ expr: q.expr, due_in_days: results[q.expr] ? 7 : 1 })),
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  function buildQuiz() {
    const quizEl = document.getElementById('quiz');
    const pool = data.expressions;
    if (pool.length < 3) {
      quizEl.textContent = '이 학습에는 퀴즈를 만들 표현이 부족해요.';
      return;
    }
    const questions = shuffled(pool).slice(0, 3);
    const results = {};

    questions.forEach((correctExpr, qi) => {
      const distractors = shuffled(pool.filter((p) => p.expr !== correctExpr.expr)).slice(0, 2);
      const options = shuffled([correctExpr, ...distractors]);

      const qBox = el('div', 'quiz-q');
      qBox.appendChild(el('div', 'quiz-question', `Q${qi + 1}. "${correctExpr.expr}"의 뜻/뉘앙스로 가장 알맞은 것은?`));
      const optsEl = el('div', 'quiz-options');

      options.forEach((opt) => {
        const btn = el('button', 'quiz-option', opt.tag);
        btn.type = 'button';
        btn.addEventListener('click', () => {
          const isCorrect = opt.expr === correctExpr.expr;
          Array.from(optsEl.children).forEach((b) => { b.disabled = true; });
          btn.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect) {
            const correctBtn = Array.from(optsEl.children).find((b) => b.textContent === correctExpr.tag);
            if (correctBtn) correctBtn.classList.add('correct');
          }
          results[correctExpr.expr] = isCorrect;
          if (Object.keys(results).length === questions.length) {
            const correctCount = Object.values(results).filter(Boolean).length;
            const summary = el(
              'div', 'quiz-result',
              `오늘의 표현 ${data.expressions.length}개 · 퀴즈 ${questions.length}문제 중 ${correctCount}개 정답. ` +
              (correctCount < questions.length ? '틀린 표현은 내일 다시 볼게요.' : '완벽해요! 7일 뒤에 복습해요.')
            );
            quizEl.appendChild(summary);
            saveQuizProgress(questions, results);
          }
        });
        optsEl.appendChild(btn);
      });
      qBox.appendChild(optsEl);
      quizEl.appendChild(qBox);
    });
  }
  buildQuiz();
</script>
</body>
</html>
