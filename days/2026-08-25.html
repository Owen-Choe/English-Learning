<script id="expr-data" type="application/json">{"scene_summary": "시드는 저녁을 먹으며 바닥에 앉아 피자를 먹다가, 인생의 전환기에 있다는 불안감과 미래에 대한 불확실함을 솔직하게 털어놓는다. 어디서 살게 될지 모르는 상황에 대한 두려움과 함께, 자신이 걱정이 많은 성격이라는 점도 언급한다. 이후 자연스럽게 스킨케어 루틴으로 화제를 전환한다.", "start_sec": 589, "end_sec": 655, "script": [{"speaker": "Sid", "en": "You know what? It's good enough.", "ko": "있잖아, 이 정도면 충분해.", "timestamp": 589}, {"speaker": "Sid", "en": "Will I link the recipe? No.", "ko": "레시피 링크 걸어줄 거냐고? 아니.", "timestamp": 590}, {"speaker": "Sid", "en": "I feel like I'm at this point in my life where I'm really in between chapters.", "ko": "지금 내 인생이 딱 챕터와 챕터 사이에 낀 시기인 것 같아.", "timestamp": 595}, {"speaker": "Sid", "en": "It just feels scary and uncertain to not know exactly what my life is going to pan out to be.", "ko": "내 인생이 정확히 어떻게 흘러갈지 모른다는 게 무섭고 불확실하게 느껴져.", "timestamp": 599}, {"speaker": "Sid", "en": "A lot of it having to do with location.", "ko": "그 중 많은 부분이 어디서 살지랑 관련이 있어.", "timestamp": 603}, {"speaker": "Sid", "en": "As I get older, I really think about location and where I want to be.", "ko": "나이가 들수록 어디서 살고 싶은지 정말 많이 생각하게 돼.", "timestamp": 609}, {"speaker": "Sid", "en": "I don't know if I'm going to leave. I don't know.", "ko": "여길 떠날지 안 떠날지 모르겠어. 진짜 모르겠어.", "timestamp": 619}, {"speaker": "Sid", "en": "I even feel nervous to say this to you guys because I don't want to set anything in stone or assumptions to be made.", "ko": "이 얘기를 하는 것조차 조심스러워, 뭔가 확정짓거나 넘겨짚게 하고 싶지 않거든.", "timestamp": 623}, {"speaker": "Sid", "en": "I like to know what's going to happen because I am a very anxious type A person.", "ko": "난 앞으로 무슨 일이 일어날지 미리 알고 싶어 하는, 굉장히 불안이 많은 타입 A 성격이거든.", "timestamp": 629}, {"speaker": "Sid", "en": "Anyways, I'm saying all this because I personally get so much comfort from talking to friends or online.", "ko": "아무튼, 이런 얘길 하는 이유는 친구들이나 온라인에서 얘기 나누는 게 나한테 큰 위로가 되기 때문이야.", "timestamp": 634}, {"speaker": "Sid", "en": "Not that I'm going through anything detrimental or anything at all, but I'm going to do my skincare.", "ko": "심각한 일을 겪고 있는 건 전혀 아니지만, 이제 스킨케어를 하러 갈게.", "timestamp": 648}], "expressions": [{"expr": "in between chapters", "category": "idiom", "formality": "neutral", "workplace_safe": true, "tag": "인생의 전환기, 이도 저도 아닌 시기 (비유적 표현)", "quote_en": "I feel like I'm at this point in my life where I'm really in between chapters.", "quote_speaker": "Sid", "context": "인생을 책에 비유해서 '챕터(chapter)'로 표현하는 관용구로, 한 시기가 끝났지만 다음 시기가 아직 명확히 시작되지 않은 애매한 전환기를 뜻한다. 진로, 연애, 거주지 등 인생의 큰 결정을 앞두고 불확실함을 느낄 때 자주 쓰인다. 한국어의 '인생의 과도기' 혹은 '이도 저도 아닌 시기'와 비슷한 뉘앙스다. 자기소개나 브이로그, 에세이형 콘텐츠에서 감성적으로 자신의 상태를 설명할 때 잘 어울린다.", "listening_tip": "'in between'은 붙어서 빠르게 발음되며 [인비트윈]처럼 들리고, chapters는 첫 음절에 강세가 온다.", "examples": [{"en": "After graduating and before starting my new job, I felt like I was in between chapters.", "ko": "졸업하고 새 직장을 시작하기 전까지, 나는 인생의 과도기에 있는 것 같았다."}, {"en": "She said the divorce left her in between chapters of her life.", "ko": "그녀는 이혼 후 인생의 한 챕터와 챕터 사이에 낀 것 같다고 말했다."}], "timestamp": 597}, {"expr": "pan out", "category": "phrasal_verb", "formality": "neutral", "workplace_safe": true, "tag": "결과적으로 ~하게 되다, (일이) 풀리다/전개되다", "quote_en": "It just feels scary and uncertain to not know exactly what my life is going to pan out to be.", "quote_speaker": "Sid", "context": "계획이나 상황이 최종적으로 어떤 결과로 이어질지를 나타내는 구동사로, 특히 불확실한 미래나 계획에 대해 이야기할 때 자주 쓰인다. 'How things pan out'처럼 명사구로도 매우 흔히 쓰인다. 직장에서 프로젝트 결과를 이야기할 때도 자연스럽게 쓸 수 있는 실용적인 표현이다. 부정적이든 긍정적이든 결과가 나오기 전 불확실성을 강조할 때 잘 어울린다.", "listening_tip": "'pan out'은 두 단어가 거의 붙어서 [패나웃]처럼 연음되어 들린다.", "examples": [{"en": "We don't know how the negotiations will pan out yet.", "ko": "협상이 어떻게 결론 날지는 아직 몰라."}, {"en": "I hope this new business idea pans out for him.", "ko": "이 새 사업 아이디어가 그에게 잘 풀리길 바라."}], "timestamp": 601}, {"expr": "set anything in stone", "category": "idiom", "formality": "neutral", "workplace_safe": true, "tag": "확정 짓다, 못 박다 (변경 불가능하게 정하다)", "quote_en": "I don't want to set anything in stone or assumptions to be made.", "quote_speaker": "Sid", "context": "돌에 새기면 지울 수 없다는 데서 유래한 관용구로, 계획이나 결정을 절대 바꿀 수 없게 확정한다는 뜻이다. 보통 부정문으로 'nothing is set in stone(아직 확정된 건 아니다)'처럼 쓰여, 불확실성이나 유연성을 강조할 때 사용된다. 직장 회의에서 일정이나 계획을 논할 때도 매우 자주 쓰이는 실용적 표현이다. 화자는 자신의 미래 계획을 말하면서 오해를 사고 싶지 않아 이 표현을 쓴다.", "listening_tip": "'set in stone'은 하나의 덩어리처럼 붙여 발음되며, 강세는 stone에 강하게 떨어진다.", "examples": [{"en": "Our travel dates aren't set in stone yet, so they might change.", "ko": "여행 날짜는 아직 확정된 게 아니라서 바뀔 수도 있어."}, {"en": "Nothing is set in stone; we can still adjust the plan.", "ko": "아직 확정된 건 없으니 계획을 바꿀 수도 있어."}], "timestamp": 623}, {"expr": "type A person", "category": "cultural_expression", "formality": "casual", "workplace_safe": true, "tag": "완벽주의적이고 계획적인 성격 유형 (성격 심리학 용어에서 유래)", "quote_en": "I like to know what's going to happen because I am a very anxious type A person.", "quote_speaker": "Sid", "context": "'Type A personality'는 원래 심리학/의학 용어에서 유래했는데, 경쟁적이고 조급하며 계획을 철저히 세우려는 성향을 가진 사람을 가리킨다. 반대는 'Type B person'으로 느긋하고 즉흥적인 성격을 뜻한다. 미국 일상 대화에서 성격을 설명할 때 매우 흔하게 쓰이는 표현으로, 한국의 MBTI 언급과 비슷한 느낌으로 자기소개나 캐주얼한 대화에서 자주 등장한다. 문화적 배경 지식이 없으면 이해하기 어려운 표현이다.", "listening_tip": "'Type A'는 알파벳 A를 강조해서 또박또박 발음하며, 뒤에 오는 명사(person, personality)보다 A에 강세가 실린다.", "examples": [{"en": "My sister is such a type A person; she color-codes her calendar.", "ko": "내 여동생은 완전 타입 A라서 캘린더를 색깔별로 정리해."}, {"en": "Being a type A person makes it hard for me to relax on vacation.", "ko": "타입 A 성격이라서 휴가 때도 쉬는 게 어려워."}], "timestamp": 632}, {"expr": "you know what", "category": "discourse_marker", "formality": "casual", "workplace_safe": true, "tag": "있잖아, 그거 알아? (화제 전환/강조용 담화 표지)", "quote_en": "You know what? It's good enough.", "quote_speaker": "Sid", "context": "문장 앞에 붙여서 화제를 전환하거나 자신의 생각을 강조하고 싶을 때 쓰는 매우 흔한 구어체 담화 표지다. 특별한 의미 없이 대화의 리듬을 만들거나 청자의 주의를 끄는 역할을 한다. 브이로그나 캐주얼 대화에서 문장 시작할 때 습관적으로 자주 등장하며, 억양은 살짝 올라갔다가 뒤 문장에서 단정적으로 내려간다. 격식 있는 자리에서는 잘 쓰지 않는다.", "listening_tip": "'you know what'은 빠르게 뭉개져서 [야노왓]처럼 들리는 경우가 많다.", "examples": [{"en": "You know what? Let's just order pizza tonight.", "ko": "있잖아, 오늘 밤은 그냥 피자 시켜 먹자."}, {"en": "You know what, I don't even care anymore.", "ko": "있잖아, 나 이제 더 이상 신경 안 써."}], "timestamp": 589}, {"expr": "get so much comfort from", "category": "natural_phrase", "formality": "neutral", "workplace_safe": true, "tag": "~에서 큰 위안/위로를 얻다", "quote_en": "I personally get so much comfort from talking to friends or online and hearing people tell me how they're feeling.", "quote_speaker": "Sid", "context": "감정적인 위안을 얻는다는 뜻으로, 'get comfort from'은 원어민들이 힘든 감정을 나누는 맥락에서 자연스럽게 쓰는 표현이다. 'find comfort in'과 거의 같은 의미로 교체 가능하다. 한국어로 직역하면 어색하지만, 정신 건강이나 힘든 감정을 이야기할 때 매우 자주 등장하는 자연스러운 표현이다. 교과서적으로는 'be comforted by'를 배우지만 실제 대화에서는 이 표현이 훨씬 자연스럽다.", "listening_tip": "'so much'는 강조를 위해 살짝 늘려 발음되고, 'comfort from'은 t가 약화되어 부드럽게 이어진다.", "examples": [{"en": "I get so much comfort from listening to my favorite playlist when I'm stressed.", "ko": "스트레스 받을 때 내가 좋아하는 플레이리스트를 들으면 정말 큰 위안이 돼."}, {"en": "She gets a lot of comfort from her dog after a long day.", "ko": "그녀는 힘든 하루를 보낸 후 반려견에게서 큰 위안을 얻는다."}], "timestamp": 636}, {"expr": "anyways", "category": "discourse_marker", "formality": "casual", "workplace_safe": true, "tag": "아무튼, 어쨌든 (화제를 마무리하거나 전환할 때 쓰는 표지)", "quote_en": "Anyways, I'm saying all this because I personally get so much comfort from talking to friends or online.", "quote_speaker": "Sid", "context": "'anyway'의 구어체 변형으로, 문법적으로는 틀렸다고 여겨지지만 실제 미국 구어에서 매우 흔하게 쓰인다. 감정적인 이야기나 다소 무거운 주제를 이야기한 후 화제를 정리하거나 다음 내용으로 넘어갈 때 자주 사용된다. 이 영상에서도 개인적인 불안을 털어놓은 후 이 표현으로 자연스럽게 화제를 전환한다. 격식 있는 글쓰기에서는 피해야 하지만 말할 때는 전혀 어색하지 않다.", "listening_tip": "끝의 's'는 약하게 발음되며 전체적으로 빠르게 [애니웨이즈]로 흘러가듯 발음된다.", "examples": [{"en": "Anyways, let's not talk about that anymore.", "ko": "아무튼, 그 얘기는 이제 그만하자."}, {"en": "Anyways, I should probably get going.", "ko": "아무튼, 나 이제 슬슬 가봐야 할 것 같아."}], "timestamp": 634}], "video_title": "alone but not lonely // ep. 15", "channel_name": "Sydney Serena", "video_url": "https://www.youtube.com/watch?v=uu6UTLLnf_I", "lesson_date": "2026-08-25", "video_id": "uu6UTLLnf_I"}</script>
<script>
  // 보안 참고: 아래 데이터(data)는 유튜브 자막/LLM 생성 결과이며 신뢰할 수 없는 외부 콘텐츠다.
  // 저장형 XSS를 막기 위해 el()로 만든 요소는 전부 textContent만 쓰고, innerHTML은
  // 이 파일이 직접 작성한 고정 마크업(SVG 아이콘)에만 사용한다.
  const data = JSON.parse(document.getElementById('expr-data').textContent);
  const cardsEl = document.getElementById('cards');
  const jumpEl = document.getElementById('jump-row');
  let player;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  document.getElementById('scene').textContent = data.scene_summary;

  const sourceEl = document.getElementById('source-line');
  if (data.video_title) {
    sourceEl.textContent = `${data.video_title} · ${data.channel_name || ''} · `;
    const link = el('a', '', '원본 영상 보기');
    link.href = data.video_url || `https://www.youtube.com/watch?v=${data.video_id}`;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    sourceEl.appendChild(link);
    sourceEl.appendChild(el('span', '', ' · 표현 해설/번역은 AI가 생성했습니다.'));
  } else {
    sourceEl.textContent = 'AI가 생성한 번역과 해설입니다.';
  }

  function fmtTs(sec) {
    return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }

  function seek(ts) {
    if (player && player.seekTo) {
      player.seekTo(ts, true);
      player.playVideo();
    }
  }

  const scriptEl = document.getElementById('script');
  const scriptLines = [];
  data.script.forEach((line) => {
    const row = el('div', 'script-line');
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `${fmtTs(line.timestamp)}${' '}지점으로 이동`);
    row.appendChild(el('div', 'speaker', line.speaker));
    row.appendChild(el('div', 'script-en', line.en));
    row.appendChild(el('div', 'script-ko', line.ko));
    row.addEventListener('click', () => seek(line.timestamp));
    row.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        seek(line.timestamp);
      }
    });
    scriptEl.appendChild(row);
    scriptLines.push({ ts: line.timestamp, el: row });
  });

  let loopEnabled = false;

  // ponytail: naive 400ms poll, switch to rAF+state gating if this were a battery-sensitive app
  let activeLine = null;
  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();

    if (loopEnabled && t >= data.end_sec - 0.5) {
      player.seekTo(data.start_sec, true);
    }

    let current = scriptLines[0];
    for (const line of scriptLines) {
      if (line.ts <= t) current = line; else break;
    }
    if (current && current.el !== activeLine) {
      if (activeLine) {
        activeLine.classList.remove('active');
        activeLine.removeAttribute('aria-current');
      }
      current.el.classList.add('active');
      current.el.setAttribute('aria-current', 'true');
      activeLine = current.el;
    }
  }, 400);

  // --- 재생 속도 / 구간 반복 ---
  document.querySelectorAll('.speed-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(btn.dataset.rate));
      document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const loopBtn = document.getElementById('loop-toggle');
  loopBtn.addEventListener('click', () => {
    loopEnabled = !loopEnabled;
    loopBtn.setAttribute('aria-pressed', String(loopEnabled));
    loopBtn.classList.toggle('active', loopEnabled);
  });

  // --- 자막 모드 (영어만 / 영어+한국어 / 숨기기), 마지막 선택을 기억한다 ---
  const SUB_MODE_KEY = 'english-learning-sub-mode';
  function applySubMode(mode) {
    document.body.dataset.subMode = mode;
    localStorage.setItem(SUB_MODE_KEY, mode);
    document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  }
  document.querySelectorAll('.mode-btn').forEach((btn) => {
    btn.addEventListener('click', () => applySubMode(btn.dataset.mode));
  });
  applySubMode(localStorage.getItem(SUB_MODE_KEY) || 'both');

  function chevronIcon() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'chevron');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '16');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M6 9l6 6 6-6');
    svg.appendChild(path);
    return svg;
  }

  data.expressions.forEach((e, i) => {
    const chip = el('a', 'jump-chip display', e.expr);
    chip.href = `#expr-${i}`;
    chip.addEventListener('click', (ev) => {
      ev.preventDefault();
      const card = document.getElementById(`expr-${i}`);
      card.open = true;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      seek(e.timestamp);
      card.querySelector('.expr').focus();
    });
    jumpEl.appendChild(chip);

    const details = document.createElement('details');
    details.className = 'card';
    details.id = `expr-${i}`;
    if (i === 0) details.open = true;

    const summary = el('summary', 'card-top');
    const main = el('div', 'card-top-main');
    main.appendChild(chevronIcon());
    const titleWrap = el('div');
    const metaRow = el('div', 'expr-meta');
    metaRow.appendChild(el('span', 'category-badge', e.category.replace(/_/g, ' ')));
    if (!e.workplace_safe) {
      metaRow.appendChild(el('span', 'workplace-warning', '직장 사용 주의'));
    }
    titleWrap.appendChild(metaRow);
    const exprTitle = el('div', 'expr display', e.expr);
    exprTitle.setAttribute('tabindex', '-1');  // 점프 후 포커스 이동 대상(탭 순서에는 없음)
    titleWrap.appendChild(exprTitle);
    titleWrap.appendChild(el('div', 'tag', e.tag));
    main.appendChild(titleWrap);
    summary.appendChild(main);

    const tsBtn = el('button', 'ts', fmtTs(e.timestamp));
    tsBtn.type = 'button';
    tsBtn.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      seek(e.timestamp);
    });
    summary.appendChild(tsBtn);
    details.appendChild(summary);

    const body = el('div', 'card-body');

    const quoteBox = el('div', 'subbox subbox-quote');
    quoteBox.appendChild(el('div', 'subbox-label', '드라마 속 문장'));
    quoteBox.appendChild(el('div', 'quote', `"${e.quote_en}"`));
    quoteBox.appendChild(el('div', 'quote-speaker', `— ${e.quote_speaker}`));
    body.appendChild(quoteBox);

    const contextBox = el('div', 'subbox subbox-context');
    contextBox.appendChild(el('div', 'subbox-label', '문화 / 유머 포인트'));
    contextBox.appendChild(el('div', 'context', e.context));
    body.appendChild(contextBox);

    const tipBox = el('div', 'subbox subbox-tip');
    tipBox.appendChild(el('div', 'subbox-label', '리스닝 포인트'));
    tipBox.appendChild(el('div', 'tip', e.listening_tip));
    body.appendChild(tipBox);

    const exampleBox = el('div', 'subbox subbox-example');
    exampleBox.appendChild(el('div', 'subbox-label', '예문'));
    e.examples.forEach((ex) => {
      const exWrap = el('div', 'example');
      exWrap.appendChild(el('div', 'en', ex.en));
      exWrap.appendChild(el('div', 'ko', ex.ko));
      exampleBox.appendChild(exWrap);
    });
    body.appendChild(exampleBox);

    details.appendChild(body);
    cardsEl.appendChild(details);
  });

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: data.video_id,
      playerVars: { start: data.start_sec, end: data.end_sec, autoplay: 1, rel: 0 },
      events: {
        onReady: (ev) => ev.target.playVideo()
      }
    });
  };

  // --- 오늘의 복습 퀴즈 (기존 표현 데이터로 클라이언트에서 생성, 별도 LLM 호출 없음) ---
  function shuffled(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function saveQuizProgress(questions, results) {
    const STORE_KEY = 'english-learning-progress';
    const store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const lessonId = data.lesson_date || data.video_id;
    store[lessonId] = {
      completed_at: new Date().toISOString(),
      quiz_results: results,
      // ponytail: 정답/오답 2단계 SRS. "애매함" 같은 중간 단계는 다음 단계에서.
      review_due: questions.map((q) => ({ expr: q.expr, due_in_days: results[q.expr] ? 7 : 1 })),
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  function buildQuiz() {
    const quizEl = document.getElementById('quiz');
    const pool = data.expressions;
    if (pool.length < 3) {
      quizEl.textContent = '이 학습에는 퀴즈를 만들 표현이 부족해요.';
      return;
    }
    const questions = shuffled(pool).slice(0, 3);
    const results = {};

    questions.forEach((correctExpr, qi) => {
      const distractors = shuffled(pool.filter((p) => p.expr !== correctExpr.expr)).slice(0, 2);
      const options = shuffled([correctExpr, ...distractors]);

      const qBox = el('div', 'quiz-q');
      qBox.appendChild(el('div', 'quiz-question', `Q${qi + 1}. "${correctExpr.expr}"의 뜻/뉘앙스로 가장 알맞은 것은?`));
      const optsEl = el('div', 'quiz-options');

      options.forEach((opt) => {
        const btn = el('button', 'quiz-option', opt.tag);
        btn.type = 'button';
        btn.addEventListener('click', () => {
          const isCorrect = opt.expr === correctExpr.expr;
          Array.from(optsEl.children).forEach((b) => { b.disabled = true; });
          btn.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect) {
            const correctBtn = Array.from(optsEl.children).find((b) => b.textContent === correctExpr.tag);
            if (correctBtn) correctBtn.classList.add('correct');
          }
          results[correctExpr.expr] = isCorrect;
          if (Object.keys(results).length === questions.length) {
            const correctCount = Object.values(results).filter(Boolean).length;
            const summary = el(
              'div', 'quiz-result',
              `오늘의 표현 ${data.expressions.length}개 · 퀴즈 ${questions.length}문제 중 ${correctCount}개 정답. ` +
              (correctCount < questions.length ? '틀린 표현은 내일 다시 볼게요.' : '완벽해요! 7일 뒤에 복습해요.')
            );
            quizEl.appendChild(summary);
            saveQuizProgress(questions, results);
          }
        });
        optsEl.appendChild(btn);
      });
      qBox.appendChild(optsEl);
      quizEl.appendChild(qBox);
    });
  }
  buildQuiz();

  // --- 다음 학습 관심사 신청: 서버가 없으니 GitHub 이슈를 임시 저장소로 사용한다 ---
  const topicInput = document.getElementById('topic-input');
  const topicSubmit = document.getElementById('topic-submit');
  function submitTopicRequest() {
    const text = topicInput.value.trim();
    if (!text) return;
    const url = `https://github.com/Owen-Choe/English-Learning/issues/new?title=${encodeURIComponent(text)}&labels=topic-request`;
    window.open(url, '_blank', 'noopener');
    topicInput.value = '';
  }
  topicSubmit.addEventListener('click', submitTopicRequest);
  topicInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') submitTopicRequest();
  });
</script>
</body>
</html>
